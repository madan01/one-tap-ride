<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>One-Tap Ride</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#155E4D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="One-Tap Ride">
<style>
  :root{
    color-scheme: light dark;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #F5F3EE;
    --surface: #FFFFFF;
    --surface-sunken: #ECE9E1;
    --ink: #23302C;
    --ink-muted: #6B7670;
    --ink-faint: #97A099;
    --accent: #155E4D;
    --accent-strong: #0E4A3D;
    --accent-contrast: #FFFFFF;
    --border: #DDD8CB;
    --danger: #B4432E;
    --focus: #1B7A63;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: #121714;
      --surface: #1B211D;
      --surface-sunken: #232B26;
      --ink: #ECEEEA;
      --ink-muted: #9BA69E;
      --ink-faint: #6E7871;
      --accent: #3FBF9B;
      --accent-strong: #58D6B1;
      --accent-contrast: #08211B;
      --border: #2C3530;
      --danger: #E28470;
      --focus: #3FBF9B;
    }
  }
  :root[data-theme="dark"]{
    --bg: #121714;
    --surface: #1B211D;
    --surface-sunken: #232B26;
    --ink: #ECEEEA;
    --ink-muted: #9BA69E;
    --ink-faint: #6E7871;
    --accent: #3FBF9B;
    --accent-strong: #58D6B1;
    --accent-contrast: #08211B;
    --border: #2C3530;
    --danger: #E28470;
    --focus: #3FBF9B;
  }

  * { box-sizing: border-box; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
  body{
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Atkinson Hyperlegible", "Segoe UI", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-inline: 20px;
    padding-block: 28px;
  }

  .wrap{
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  .masthead{
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }
  .masthead h1{
    font-size: 1.5rem;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .masthead .clock{
    font-variant-numeric: tabular-nums;
    color: var(--ink-muted);
    font-size: 1.05rem;
  }

  .card{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 26px;
    padding: 26px;
    display: flex;
    flex-direction: column;
    gap: 22px;
    box-shadow: 0 1px 0 rgba(0,0,0,0.02);
  }

  .rides{
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .route{
    display: flex;
    flex-direction: column;
    gap: 0;
  }
  .stop{
    display: grid;
    grid-template-columns: 28px 1fr;
    column-gap: 14px;
    align-items: start;
    padding-block: 10px;
  }
  .stop .dot-col{
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 100%;
  }
  .dot{
    width: 16px;
    height: 16px;
    border-radius: 50%;
    border: 3px solid var(--accent);
    background: var(--surface);
    flex-shrink: 0;
    margin-top: 4px;
  }
  .dot.filled{ background: var(--accent); }
  .rail{
    width: 2px;
    flex: 1;
    background: var(--border);
    margin-block: 2px;
  }
  .stop-label{
    font-size: 0.85rem;
    color: var(--ink-faint);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin: 0 0 4px;
  }
  .stop-name{
    font-size: 1.2rem;
    font-weight: 700;
    margin: 0;
    line-height: 1.3;
  }

  .ride-tag{
    display: inline-flex;
    align-self: flex-start;
    align-items: center;
    gap: 8px;
    background: var(--surface-sunken);
    border-radius: 999px;
    padding: 8px 16px 8px 10px;
    font-size: 0.95rem;
    color: var(--ink-muted);
  }
  .ride-tag svg{ width: 20px; height: 20px; flex-shrink: 0; }

  .book-btn{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    width: 100%;
    min-height: 92px;
    border: none;
    border-radius: 22px;
    background: var(--accent);
    color: var(--accent-contrast);
    font-family: inherit;
    font-size: 1.7rem;
    font-weight: 800;
    letter-spacing: -0.01em;
    cursor: pointer;
    text-decoration: none;
    transition: background 0.15s ease, transform 0.05s ease;
  }
  .book-btn:hover{ background: var(--accent-strong); }
  .book-btn:active{ transform: scale(0.98); }
  .book-btn:focus-visible{ outline: 3px solid var(--focus); outline-offset: 3px; }
  .book-btn svg{ width: 40px; height: 40px; flex-shrink: 0; }

  .empty-card{
    align-items: center;
    text-align: center;
  }
  .empty-card p{
    margin: 0;
    color: var(--ink-muted);
    font-size: 1.05rem;
    line-height: 1.5;
  }
  .empty-card .book-btn{
    background: var(--accent);
  }

  .help-row{
    display: flex;
    gap: 14px;
  }
  .help-btn{
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    min-height: 64px;
    border-radius: 18px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink);
    font-family: inherit;
    font-size: 1.15rem;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
  }
  .help-btn:focus-visible{ outline: 3px solid var(--focus); outline-offset: 2px; }
  .help-btn svg{ width: 26px; height: 26px; flex-shrink: 0; color: var(--ink-muted); }

  .status{
    min-height: 1.4em;
    text-align: center;
    font-size: 1.05rem;
    color: var(--ink-muted);
  }
  .status.active{ color: var(--accent); font-weight: 700; }

  .footnote{
    text-align: center;
    font-size: 0.85rem;
    color: var(--ink-faint);
    line-height: 1.5;
  }
  .footnote button, .footnote a{
    background: none;
    border: none;
    color: var(--ink-muted);
    font-family: inherit;
    font-size: 0.85rem;
    text-decoration: underline;
    cursor: pointer;
    padding: 4px;
  }

  .install-hint{
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface-sunken);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 12px 14px;
    font-size: 0.92rem;
    color: var(--ink-muted);
    line-height: 1.4;
  }
  .install-hint button{
    margin-left: auto;
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--ink-faint);
    font-size: 1.2rem;
    line-height: 1;
    cursor: pointer;
  }

  @media (max-width: 380px){
    .book-btn{ font-size: 1.4rem; }
    .book-btn svg{ width: 34px; height: 34px; }
  }
</style>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
</head>
<body>

<div class="wrap">
  <header class="masthead">
    <h1>One-Tap Ride</h1>
    <span class="clock" id="clock">--:--</span>
  </header>

  <div class="install-hint" id="install-hint" hidden>
    <span id="install-hint-text"></span>
    <button type="button" id="install-hint-close" aria-label="Dismiss">&times;</button>
  </div>

  <div class="rides" id="rides"></div>

  <div class="card empty-card" id="empty-card" hidden>
    <p>No rides have been set up yet.<br>Ask whoever manages this app to add one.</p>
    <a class="book-btn" href="config.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      Add a ride
    </a>
  </div>

  <div class="help-row">
    <a class="help-btn" id="call-btn" href="tel:" role="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
      Call Family
    </a>
  </div>

  <p class="status" id="status" role="status" aria-live="polite">&nbsp;</p>

  <p class="footnote">
    Runs from any phone browser &mdash; add it to your home screen for the full app feel.<br>
    <button type="button" id="how-btn">How this works</button>
    &nbsp;&middot;&nbsp;
    <a href="config.html">Manage rides</a>
  </p>
</div>

<template id="ride-card-template">
  <div class="card ride-card">
    <div class="route">
      <div class="stop">
        <div class="dot-col"><div class="dot filled"></div><div class="rail"></div></div>
        <div>
          <p class="stop-label">Pickup</p>
          <p class="stop-name js-source-label">Pickup</p>
        </div>
      </div>
      <div class="stop">
        <div class="dot-col"><div class="dot"></div></div>
        <div>
          <p class="stop-label">Drop-off</p>
          <p class="stop-name js-target-label">Drop-off</p>
        </div>
      </div>
    </div>
    <span class="ride-tag">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h14M5 17a2 2 0 1 0 0 .01M19 17a2 2 0 1 0 0 .01M5 17l1.2-6A2 2 0 0 1 8.14 9.5h7.72a2 2 0 0 1 1.94 1.5L19 17M6 12h12"/></svg>
      <span class="js-type-label">Auto</span>
    </span>
    <a class="book-btn js-book-btn" href="#">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h14M5 17a2 2 0 1 0 0 .01M19 17a2 2 0 1 0 0 .01M5 17l1.2-6A2 2 0 0 1 8.14 9.5h7.72a2 2 0 0 1 1.94 1.5L19 17M6 12h12"/></svg>
      <span class="js-ride-name">Ride</span>
    </a>
  </div>
</template>

<script src="rides.js"></script>
<script>
(function(){
  "use strict";

  var Store = window.OneTapRideStore;

  var el = {
    ridesWrap: document.getElementById("rides"),
    emptyCard: document.getElementById("empty-card"),
    status: document.getElementById("status"),
    callBtn: document.getElementById("call-btn"),
    howBtn: document.getElementById("how-btn"),
    clock: document.getElementById("clock"),
    template: document.getElementById("ride-card-template")
  };

  function tickClock(){
    var now = new Date();
    var h = now.getHours();
    var m = now.getMinutes();
    var ampm = h >= 12 ? "PM" : "AM";
    var h12 = h % 12; if(h12 === 0) h12 = 12;
    el.clock.textContent = h12 + ":" + (m < 10 ? "0" + m : m) + " " + ampm;
  }
  tickClock();
  setInterval(tickClock, 15000);

  function showStatus(text, active){
    el.status.textContent = text;
    el.status.classList.toggle("active", !!active);
    if(active){
      setTimeout(function(){
        el.status.textContent = " ";
        el.status.classList.remove("active");
      }, 4000);
    }
  }

  function renderRides(){
    var rides = Store.loadRides();
    el.ridesWrap.innerHTML = "";

    if(!rides.length){
      el.emptyCard.hidden = false;
      return;
    }
    el.emptyCard.hidden = true;

    rides.forEach(function(ride){
      var node = el.template.content.firstElementChild.cloneNode(true);
      node.querySelector(".js-source-label").textContent = ride.sourceLabel || "Pickup";
      node.querySelector(".js-target-label").textContent = ride.targetLabel || "Drop-off";
      node.querySelector(".js-type-label").textContent = Store.rideTypeMeta(ride.rideType).label + " · always this ride";
      node.querySelector(".js-ride-name").textContent = ride.name || "Book Ride";

      var bookBtn = node.querySelector(".js-book-btn");
      bookBtn.href = Store.buildDeepLink(ride);
      bookBtn.addEventListener("click", function(){
        showStatus("Opening Uber for " + (ride.name || "your ride") + "…", true);
      });

      el.ridesWrap.appendChild(node);
    });
  }

  function renderFamily(){
    var phone = Store.loadFamilyPhone();
    el.callBtn.href = phone ? ("tel:" + phone.replace(/\s+/g, "")) : "tel:";
    el.callBtn.style.opacity = phone ? "1" : "0.55";
  }

  el.howBtn.addEventListener("click", function(){
    alert("Each button opens the Uber app with that ride's pickup and drop-off already filled in — you only need to tap Confirm inside Uber. Ask whoever manages this app to add, edit or reorder rides, or update the family phone number, from “Manage rides.” Nothing here is stored anywhere except on this phone.");
  });

  renderFamily();
  renderRides();
  showStatus(" ", false);

  // Re-render if rides/family data changes in another tab (e.g. config page open alongside).
  window.addEventListener("storage", function(e){
    if(e.key === Store.RIDES_KEY) renderRides();
    if(e.key === Store.FAMILY_PHONE_KEY) renderFamily();
  });
  // Also refresh whenever this tab becomes visible again (covers same-tab navigation back from config.html).
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState === "visible"){ renderRides(); renderFamily(); }
  });

  // Install-to-home-screen hint (per-device, dismissible, never nags again once closed)
  (function(){
    var hint = document.getElementById("install-hint");
    var hintText = document.getElementById("install-hint-text");
    var closeBtn = document.getElementById("install-hint-close");

    var isStandalone = false;
    try{
      isStandalone = window.navigator.standalone === true ||
        (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
    }catch(e){ isStandalone = false; }

    var dismissed = false;
    try{ dismissed = localStorage.getItem(Store.HINT_KEY) === "1"; }catch(e){ dismissed = false; }

    if(!isStandalone && !dismissed){
      var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
      hintText.textContent = isIOS
        ? "Tip: tap the Share icon below, then “Add to Home Screen”, so this opens like an app."
        : "Tip: open the browser menu and choose “Add to Home screen”, so this opens like an app.";
      hint.hidden = false;
    }

    closeBtn.addEventListener("click", function(){
      hint.hidden = true;
      try{ localStorage.setItem(Store.HINT_KEY, "1"); }catch(e){ /* ignore */ }
    });
  })();
})();
</script>
</body>
</html>
